<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 260" width="100%" preserveAspectRatio="xMidYMid slice" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#0b2a5b"/>
      <stop offset="100%" stop-color="#1f6feb"/>
    </linearGradient>
    <linearGradient id="w1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0.55"/>
    </linearGradient>
    <linearGradient id="w2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1f6feb" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#79c0ff" stop-opacity="0.45"/>
    </linearGradient>
    <linearGradient id="w3" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0d1117" stop-opacity="0.85"/>
      <stop offset="100%" stop-color="#161b22" stop-opacity="0.85"/>
    </linearGradient>
  </defs>

  <rect width="1000" height="260" fill="url(#bg)"/>

  <!-- back wave: slow -->
  <g>
    <path fill="url(#w1)" d="M0,165 Q250,115 500,165 T1000,165 T1500,165 T2000,165 V260 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1000 0" dur="14s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- middle wave: medium, opposite phase -->
  <g>
    <path fill="url(#w2)" d="M0,185 Q250,235 500,185 T1000,185 T1500,185 T2000,185 V260 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1000 0" dur="9s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- front wave: fast, dark -->
  <g>
    <path fill="url(#w3)" d="M0,215 Q250,180 500,215 T1000,215 T1500,215 T2000,215 V260 H0 Z">
      <animateTransform attributeName="transform" type="translate" from="0 0" to="-1000 0" dur="6s" repeatCount="indefinite"/>
    </path>
  </g>

  <!-- text -->
  <text x="500" y="92" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="54" font-weight="700" fill="#ffffff">
    Mustafa Khan
    <animate attributeName="opacity" values="0;1" dur="1.4s" fill="freeze"/>
  </text>
  <text x="500" y="128" text-anchor="middle" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" fill="#c9d1d9" letter-spacing="1.5">
    B.Tech (Integrated) CSE  •  MGM University
    <animate attributeName="opacity" values="0;1" dur="2s" fill="freeze"/>
  </text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
